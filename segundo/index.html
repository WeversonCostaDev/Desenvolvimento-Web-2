<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/style.css">

    <title>segundo</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>

    <div class="container">
      <header id="header">
        <div class="anuncio">
          <p>Primeira compra? Use o cupom PRIMEIRACOMPRA5</p>
        </div>

        <div id="faixa">
          <img src="/img/darkside-logo.svg" alt="darkside-logo">

          <form action="">
            <input type="search" placeholder="Títulos, Autores, Gêneros e Linhas editoriais">
            <button type="submit">
              <img width="25px" src="/img/lupa.svg" alt="">
            </button>
          </form>

        </div>
        
        <nav class="menu">

          <a href="">Livros</a>
          <a href="">Marcas</a>
          <a href="">DarkPaper</a>
          <a class="destaque" href="">Promoções</a>
          <a href="">Tarot & Oráculos</a>
          <a href="">Box e Coleções</a>
          <a href="">Raridades</a>
          <a href="">Sobre</a>
          <a href="">Contato</a>

        </nav>
          
      </header>

      <main id="main">

        <section>
          <div class="carrossel-container">
            <div class="carrossel">
              <picture id="slide-1">
                <source media="(max-width: 990px)" srcset="/img/banner-1-mobile.jpg">
                <img src="/img/banner-1.webp" alt="">
              </picture>
              <picture id="slide-2">
                <source media="(max-width: 990px)" srcset="/img/banner-2-mobile.jpg">
                <img src="/img/banner-2.jpg" alt="">
              </picture>
              <picture id="slide-3">
                <source media="(max-width: 990px)" srcset="/img/banner-3-mobile.webp">
                <img src="/img/banner-3.jpg" alt="">
              </picture>
              <picture id="slide-4">
                <source media="(max-width: 990px)" srcset="/img/banner-4-mobile.webp">
                <img src="/img/banner-4.jpg" alt="">
              </picture>
            </div>

            <div class="slider-nav">
              <a href="#slide-1"></a>
              <a href="#slide-2"></a>
              <a href="#slide-3"></a>
              <a href="#slide-4"></a>
            </div>
          </div>
        </section>

        <section>
          
          <h1>Lançamentos</h1>
          
            <div class="card-container">
              <img src="/img/shigahime_vol_2_mini_capa.png" alt="">
              <img src="/img/exorcista_slime_thmbnail.png" alt="">
              <img src="/img/a_odisseia_MINI_capa.png" alt="">
              <img src="/img/a_cordeirinha_loja_MINI_capa.png" alt="">
              <img src="/img/irmao_MINI_capa.png" alt="">
              <img src="/img/irmao_MINI_capa.png" alt="">
            </div>

        </section>

        <section>Conteudo</section>

      </main>
      <footer id="footer">Footer</footer>
    </div>

  </body>
</html>
